spring.application.name=urlshortener

# DATABASE (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SERVER
server.port=8080

# REDIS
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# APP CUSTOM PROPERTIES
app.base-url=http://localhost:8080/
app.machine-id=1
app.trust-proxy-headers=false

# KAFKA (the producer/consumer factories are defined in KafkaConfig)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-group-v3

# BLOOM FILTER
app.bloom.expected-elements=1000000
app.bloom.false-positive-rate=0.01
